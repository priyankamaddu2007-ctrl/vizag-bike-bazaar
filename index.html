<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana Vizag Bikes - Trusted Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#7c3aed;min-height:100vh}
header{background:#0f172a;color:white;padding:20px;text-align:center}
.container{max-width:1000px;margin:auto;padding:15px}
.search{background:white;padding:12px;border-radius:10px;display:flex;gap:8px;margin-bottom:15px}
.search input,.search select{padding:10px;border:1px solid #ddd;border-radius:8px;flex:1}
.search button{padding:10px 15px;border:none;border-radius:8px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
.card{background:white;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:150px;object-fit:cover}
.card-body{padding:10px}
.price{color:green;font-weight:bold}
.modal{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:999;align-items:center;justify-content:center}
.modal.show{display:flex}
.box{background:white;padding:20px;border-radius:12px;max-width:400px;width:90%;max-height:80vh;overflow:auto}
.box button{padding:10px;width:100%;margin-top:8px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.call{background:#2563eb;color:white}.wa{background:#25D366;color:white}.close{background:#0f172a;color:white}
.footer{background:#0f172a;color:white;text-align:center;padding:20px;margin-top:20px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🏍️ Mana Vizag Bikes</h1>
<p>Trusted Hub - Verified by Priyanka Maddu</p>
<br>
<button onclick="showSell()" style="padding:10px 20px;background:orange;color:white;border:none;border-radius:20px;font-weight:bold;cursor:pointer">+ Sell Your Bike</button>
<button onclick="toggleHubs()" style="padding:10px 20px;background:rgba(255,255,255,.2);color:white;border:1px solid white;border-radius:20px;cursor:pointer;margin-left:8px">🏪 Trusted Hubs (8)</button>
<br><br>
<button onclick="showUsed()" style="padding:8px 15px;border-radius:20px;border:none;margin:3px;background:white;font-weight:bold;cursor:pointer">Trusted Used</button>
<button onclick="showNew()" style="padding:8px 15px;border-radius:20px;border:none;margin:3px;background:rgba(255,255,255,.8);cursor:pointer">New 2026</button>
</header>

<div class="container">
<div id="hubList" style="display:none;background:white;padding:12px;border-radius:10px;margin-bottom:12px"></div>
<div class="search">
<input id="budget" type="number" placeholder="Budget">
<select id="brand"><option value="">All Brands</option><option>Honda</option><option>Bajaj</option><option>Yamaha</option></select>
<button onclick="doFilter()">Search</button>
<button onclick="doReset()" style="background:#0f172a">Reset</button>
</div>
<div id="msg" style="color:white;font-weight:bold;margin-bottom:10px"></div>
<div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="modal" id="sellModal"><div class="box">
<h3>Sell Bike</h3>
<input id="s_name" placeholder="Bike Name" style="width:100%;padding:8px;margin:4px 0">
<input id="s_price" type="number" placeholder="Price" style="width:100%;padding:8px;margin:4px 0">
<input id="s_phone" placeholder="Phone" style="width:100%;padding:8px;margin:4px 0">
<input id="s_loc" placeholder="Location" style="width:100%;padding:8px;margin:4px 0">
<button class="call" onclick="addNew()">Publish</button>
<button class="close" onclick="hideSell()">Cancel</button>
</div></div>

<div class="footer">
© 2026 Mana Vizag Bikes - Trusted Hub<br>
Crafted with 💜 by Priyanka Maddu<br>
Vizag's Independent Verified Marketplace | Transparency First<br>
✓ Verified Papers | ✓ Certified Condition | ✓ Real Photos | ✓ Live Location
</div>

<script>
var hubs=[
{name:"Mana Vizag Hub - MVP",addr:"MVP Colony",phone:"08912551234"},
{name:"Dwaraka Nagar Hub",addr:"Dwaraka Nagar",phone:"08912705678"},
{name:"Siripuram Hub",addr:"Siripuram",phone:"08912569012"},
{name:"Gajuwaka Hub",addr:"Gajuwaka",phone:"08912513456"}
];
var bikes=[
{name:"Honda Dream Yuga 2016",price:48000,km:"32k km",year:"2016",brand:"Honda",phone:"9876543210",loc:"MVP, Vizag",owner:"1st Owner",img:"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400",desc:"Bike manchi condition lo undi, papers anni clear."},
{name:"Hero Glamour 2017",price:52000,km:"28k km",year:"2017",brand:"Hero",phone:"9876543211",loc:"Gajuwaka",owner:"1st Owner",img:"https://images.unsplash.com/photo-1591637333184-19aa84b3e01f?w=400",desc:"Single owner, well maintained."},
{name:"Bajaj Avenger 220",price:68000,km:"25k km",year:"2019",brand:"Bajaj",phone:"9876543212",loc:"Dwaraka Nagar",owner:"2nd Owner",img:"https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=400",desc:"Premium cruiser, excellent condition."},
{name:"Yamaha FZ 2018",price:75000,km:"22k km",year:"2018",brand:"Yamaha",phone:"9876543213",loc:"Siripuram",owner:"1st Owner",img:"https://images.unsplash.com/photo-1558981852-426c6c22a060?w=400",desc:"FZ good condition, service history."},
{name:"Activa 5G 2020",price:55000,km:"18k km",year:"2020",brand:"Honda",phone:"9876543215",loc:"Maddilapalem",owner:"1st Owner",img:"https://images.unsplash.com/photo-1585671560692-0a7d56f340fd?w=400",desc:"Scooty excellent condition."}
];
var newBikes=[
{name:"Honda Shine 125 2026",price:82722,km:"0 km NEW",year:"2026 NEW",brand:"Honda",phone:"Showroom",loc:"Honda Showroom",owner:"Brand New",img:"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400",desc:"Brand new, full warranty."}
];
var cur=bikes;

function render(list){
var g=document.getElementById("grid");
var m=document.getElementById("msg");
g.innerHTML="";
for(var i=0;i<list.length;i++){
var b=list[i];
g.innerHTML+='<div class="card" onclick="openBike('+i+')"><img src="'+b.img+'"><div class="card-body"><h4>'+b.name+'</h4><p><span style="background:#dcfce7;padding:2px 6px;border-radius:10px;font-size:10px">'+b.year+'</span> <span style="background:#e0f2fe;padding:2px 6px;border-radius:10px;font-size:10px">Papers ✓</span></p><p><span class="price">₹'+b.price+'</span> - '+b.km+'</p><p style="font-size:11px;color:gray">📍 '+b.loc+' | '+b.owner+'</p><button style="width:100%;margin-top:5px;padding:7px;background:#0f172a;color:white;border:none;border-radius:6px">View Details</button></div></div>';
}
m.innerHTML=list.length+" Bikes - Click Any Card - It Will Open!";
}

function openBike(i){
var b=cur[i];
document.getElementById("box").innerHTML='<img src="'+b.img+'" style="width:100%;height:160px;object-fit:cover;border-radius:8px"><h3 style="margin-top:8px">'+b.name+'</h3><p>₹'+b.price+' - '+b.km+' - '+b.year+'</p><p style="background:#f0fdf4;padding:8px;border-radius:8px;margin-top:8px;font-size:13px"><b>Papers:</b> ✅ RC ✅ Insurance ✅ Pollution - All Available<br><b>Condition:</b> Bike manchi condition lo undi - Engine 85% Tyre 80%<br><b>Location:</b> 📍 '+b.loc+'</p><p style="font-size:12px;background:#f8fafc;padding:8px;border-radius:8px;margin-top:6px">'+b.desc+'</p><button class="call" onclick="window.open(\'tel:'+b.phone+'\')">📞 Call '+b.phone+'</button><button class="wa" onclick="window.open(\'https://wa.me/91'+b.phone.slice(-10)+'\')">💬 WhatsApp</button><button class="close" onclick="hideModal()">Close</button>';
document.getElementById("modal").classList.add("show");
}

function openHub(i){
var s=hubs[i];
document.getElementById("box").innerHTML='<h3>🏪 '+s.name+'</h3><p><b>Address:</b> '+s.addr+', Vizag</p><p><b>Phone:</b> '+s.phone+'</p><div style="background:#f0fdf4;padding:8px;border-radius:8px;margin-top:8px">✅ Trusted Hub - Papers & Condition Verified</div><button class="call" onclick="window.open(\'tel:'+s.phone+'\')">📞 Call</button><button class="wa" onclick="window.open(\'https://wa.me/91'+s.phone.slice(-10)+'\')">WhatsApp</button><button class="close" onclick="hideModal()">Close</button>';
document.getElementById("modal").classList.add("show");
}

function toggleHubs(){
var el=document.getElementById("hubList");
if(el.style.display=="block"){el.style.display="none";return}
var h='<h3>🏪 Trusted Hubs - Click to Open</h3>';
for(var i=0;i<hubs.length;i++){h+='<div style="padding:10px;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between" onclick="openHub('+i+')"><div><b>'+hubs[i].name+'</b><br><small>'+hubs[i].addr+'</small></div><span>→</span></div>'}
el.innerHTML=h;
el.style.display="block";
}
function hideModal(){document.getElementById("modal").classList.remove("show")}
function showSell(){document.getElementById("sellModal").classList.add("show")}
function hideSell(){document.getElementById("sellModal").classList.remove("show")}
function doFilter(){var bud=Number(document.getElementById("budget").value);var br=document.getElementById("brand").value;var f=[];for(var i=0;i<cur.length;i++){var b=cur[i];var ok=true;if(bud&&b.price>bud)ok=false;if(br&&b.brand!=br)ok=false;if(ok)f.push(b)}render(f)}
function doReset(){document.getElementById("budget").value="";document.getElementById("brand").value="";render(cur)}
function showUsed(){cur=bikes;render(cur)}
function showNew(){cur=newBikes;render(cur)}
function addNew(){var n=document.getElementById("s_name").value;var p=Number(document.getElementById("s_price").value);var ph=document.getElementById("s_phone").value;var l=document.getElementById("s_loc").value;if(!n||!p||!ph){alert("Name Price Phone needed");return}bikes.unshift({name:n,price:p,km:"20k km",year:"2020",brand:"Honda",phone:ph,loc:l,owner:"1st Owner",img:"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400",desc:"Bike manchi condition lo undi"});hideSell();showUsed()}

render(bikes);
var hDiv=document.getElementById("hubList");
</script>
</body>
</html>
