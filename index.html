<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#fafafa;color:#111827}
header{background:white;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}
.nav{max-width:1120px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:800}
.btn{padding:9px 14px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #e5e7eb;background:white}
.btn.dark{background:#111827;color:white;border-color:#111827}
.pills{max-width:1120px;margin:auto;padding:14px 20px 0;display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:100px;border:1px solid #e5e7eb;background:white;font-size:12px;font-weight:500;cursor:pointer}
.pill.active{background:#111827;color:white;border-color:#111827}
.wrap{max-width:1120px;margin:auto;padding:16px 20px}
.search{display:flex;gap:8px;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:10px}
.search input{flex:1;border:none;outline:none;font-size:13px}
.search select{border:none;outline:none;background:#f9fafb;padding:6px 10px;border-radius:8px;font-size:12px}
.search button{background:#111827;color:white;border:none;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.count{font-size:12px;color:#9ca3af;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:white;border:1px solid #f0f0f0;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.06)}
.card img{width:100%;height:190px;object-fit:contain;background:white;padding:8px;display:block}
.body{padding:12px}
.title{font-size:13px;font-weight:600}
.price{font-size:15px;font-weight:700;margin-top:6px}
.loc{font-size:10px;color:#9ca3af;margin-top:3px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.box{background:white;width:100%;max-width:480px;border-radius:16px;overflow:hidden;max-height:90vh;overflow-y:auto}
.box img{width:100%;height:260px;object-fit:contain;background:white;padding:10px}
.content{padding:18px}
.btn-full{width:100%;padding:10px;border-radius:10px;border:none;font-weight:600;font-size:12px;cursor:pointer;margin-top:8px;display:block;text-align:center;text-decoration:none}
.call{background:#111827;color:white}.bord{background:white;border:1px solid #e5e7eb;color:#374151}
.footer{text-align:center;padding:28px;font-size:11px;color:#9ca3af}
</style>

<div id="hubList" style="display:none;background:white;border:1px solid #f0f0f0;border-radius:14px;padding:16px;margin-bottom:14px"></div>
<div class="search"><input id="smartSearch" placeholder="Search bike" onkeydown="if(event.key==='Enter')smartSearch()"><select id="brandFilter"><option value="">All</option><option>Hero</option><option>Honda</option><option>Bajaj</option><option>Yamaha</option><option>TVS</option><option>KTM</option><option>Royal Enfield</option></select><button onclick="smartSearch()">Search</button></div>
<div class="count" id="msg">36 bikes • exact photos • click any - same opens</div>
<div class="grid" id="grid"></div>
</div>
<div class="modal" id="detailModal" onclick="if(event.target===this)closeDetail()"><div class="box"><div id="detailContent"></div></div></div>
<div class="footer">Mana Vizag Bikes • Exact photos • No repeat • © 2026</div>

let allBikes=[...newBikes,...usedBikes];
let current=allBikes.slice();

function render(list){
const grid=document.getElementById('grid');
grid.innerHTML='';
list.forEach(b=>{
const id=allBikes.indexOf(b);
if(id===-1) return;
grid.innerHTML+=`<div class="card" onclick="openDetail(${id})"><img src="${b.img}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=600&fit=crop'"><div class="body"><div class="title">${b.name}</div><div style="font-size:10px;color:#6b7280;margin-top:4px">${b.year} • ${b.mileage} • ${b.brand}</div><div class="price">₹${b.price.toLocaleString('en-IN')}</div><div class="loc">${b.km} • ${b.loc}</div></div></div>`;
});
document.getElementById('msg').textContent=`${list.length} bikes • exact model photos • em click cheste adhey vastundi`;
}

function openDetail(id){
const b=allBikes[id];
if(!b) return;
let html=`<img src="${b.img}"><div class="content"><h3 style="font-size:14px;font-weight:700">${b.name}</h3><p style="margin-top:6px"><b style="font-size:18px">₹${b.price.toLocaleString('en-IN')}</b> <span style="font-size:11px;color:#6b7280">• ${b.km} • ${b.year} • ${b.mileage}</span></p><div style="background:#f9fafb;border:1px solid #f0f0f0;border-radius:10px;padding:10px;margin-top:10px;font-size:11px"><b>Exact Photo - ${b.name}</b><br>${b.type==="New"?`${b.showroom}<br>${b.loc}`:`${b.owner}<br>${b.loc}`}<br>${b.mileage} • ${b.desc}</div><a class="btn-full call" href="tel:${b.phone}">Call ${b.phone}</a><a class="btn-full bord" href="https://wa.me/91${b.phone.toString().slice(-10)}" target="_blank">WhatsApp</a><button class="btn-full bord" onclick="closeDetail()">Close</button></div>`;
document.getElementById('detailContent').innerHTML=html;
document.getElementById('detailModal').classList.add('open');
}

function closeDetail(){document.getElementById('detailModal').classList.remove('open')}
function toggleHubs(){const el=document.getElementById('hubList');if(el.style.display==='block'){el.style.display='none';return}el.innerHTML='<h3 style="font-size:12px;font-weight:700;margin-bottom:8px">Showrooms - Click to filter</h3><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pill" onclick="filterBrand(\'Hero\');toggleHubs()">Hero MVP</button><button class="pill" onclick="filterBrand(\'Honda\');toggleHubs()">Honda Kancharapalem</button><button class="pill" onclick="filterBrand(\'Bajaj\');toggleHubs()">Bajaj Muralinagar</button><button class="pill" onclick="filterBrand(\'TVS\');toggleHubs()">TVS Madhavadhara</button><button class="pill" onclick="filterBrand(\'KTM\');toggleHubs()">KTM Marripalem</button></div>';el.style.display='block';}
function showAll(){document.getElementById('hubList').style.display='none';document.querySelectorAll('.pill').forEach(t=>t.classList.remove('active'));document.getElementById('tAll').classList.add('active');current=allBikes.slice();render(current);}
function showUsed(){document.getElementById('hubList').style.display='none';current=usedBikes.slice();render(current);}
function showNew(){document.getElementById('hubList').style.display='none';current=newBikes.slice();render(current);}
function showBudget(){document.getElementById('hubList').style.display='none';current=allBikes.filter(b=>b.price<=60000);render(current);}
function filterBrand(brand){document.getElementById('hubList').style.display='none';document.getElementById('brandFilter').value=brand;let filtered=allBikes.filter(b=>b.brand===brand);current=filtered.slice();render(current,brand);}
function smartSearch(){const q=document.getElementById('smartSearch').value.trim().toLowerCase();const brand=document.getElementById('brandFilter').value;document.getElementById('hubList').style.display='none';let filtered=allBikes.filter(b=>{let t=(b.name+' '+b.brand+' '+b.price).toLowerCase();if(brand&&b.brand!==brand) return false;if(!q) return true;return t.includes(q);});if(filtered.length===0){filtered=allBikes.slice(0,8);}current=filtered.slice();render(filtered,q||brand);}
render(allBikes);
