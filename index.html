body{background:#fafafa;color:#111827}
header{background:white;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}
.nav{max-width:1180px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:800;letter-spacing:-.5px}
.btn{padding:9px 14px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #e5e7eb;background:white}
.btn.dark{background:#111827;color:white;border-color:#111827}
.pills{max-width:1180px;margin:auto;padding:14px 20px 0;display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:100px;border:1px solid #e5e7eb;background:white;font-size:12px;font-weight:500;cursor:pointer;color:#374151}
.pill.active{background:#111827;color:white;border-color:#111827}
.wrap{max-width:1180px;margin:auto;padding:16px 20px}
.search{display:flex;gap:8px;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:10px}
.search input{flex:1;border:none;outline:none;font-size:13px}
.search select{border:none;outline:none;background:#f9fafb;padding:6px 10px;border-radius:8px;font-size:12px}
.search button{background:#111827;color:white;border:none;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.count{font-size:12px;color:#9ca3af;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:white;border:1px solid #f0f0f0;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.06)}
.card img{width:100%;height:200px;object-fit:cover;background:#f5f5f5;display:block}
.body{padding:14px}
.title{font-size:13.5px;font-weight:600;line-height:1.3}
.tags{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.tag{font-size:10px;padding:3px 7px;border-radius:100px;background:#f3f4f6;color:#6b7280}
.price{font-size:16px;font-weight:700;margin-top:6px}
.loc{font-size:11px;color:#9ca3af;margin-top:3px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.box{background:white;width:100%;max-width:480px;border-radius:18px;overflow:hidden;max-height:90vh;overflow-y:auto}
.box img{width:100%;height:280px;object-fit:cover}
.content{padding:20px}
.btn-full{width:100%;padding:11px;border-radius:10px;border:none;font-weight:600;font-size:12px;cursor:pointer;margin-top:8px;display:block;text-align:center;text-decoration:none}
.call{background:#111827;color:white}.sec{background:#f3f4f6;color:#111827}.bord{background:white;border:1px solid #e5e7eb;color:#374151}
.footer{text-align:center;padding:30px;font-size:11px;color:#9ca3af}
.input{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:8px;margin:5px 0;font-size:12px}
</style>

function closeSell(){document.getElementById('sellModal').classList.remove('open')}
function toggleHubs(){const el=document.getElementById('hubList');if(el.style.display==='block'){el.style.display='none';return}let h='<h3 style="font-size:13px;font-weight:700;margin-bottom:10px">Showrooms</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">';hubs.forEach((hub,i)=>{h+=`<div style="border:1px solid #f0f0f0;border-radius:10px;padding:10px;cursor:pointer" onclick="openHub(${i})"><b style="font-size:11px">${hub.name}</b><br><span style="font-size:10px;color:#6b7280">${hub.addr}</span><br><span style="font-size:10px;font-weight:600">${hub.phone}</span></div>`;});h+='</div>';el.innerHTML=h;el.style.display='block';}
function openHub(i){const hub=hubs[i];let hubBikes=allBikes.filter(b=>b.loc.toLowerCase().includes(hub.key.toLowerCase())||b.showroom&&b.showroom.toLowerCase().includes(hub.key.toLowerCase()));if(hubBikes.length===0) hubBikes=allBikes.slice(0,6);current=hubBikes.slice();render(current,hub.name);document.getElementById('hubList').style.display='none';}
function handlePhotos(input){const files=input.files;const preview=document.getElementById('preview');preview.innerHTML='';uploadedImages=[];for(let i=0;i<Math.min(files.length,4);i++){let file=files[i];let reader=new FileReader();reader.onload=function(e){uploadedImages.push(e.target.result);let img=document.createElement('img');img.src=e.target.result;img.style.width='60px';img.style.height='60px';img.style.borderRadius='8px';img.style.objectFit='cover';preview.appendChild(img);};reader.readAsDataURL(file);}}
function smartSearch(){const qRaw=document.getElementById('smartSearch').value.trim().toLowerCase();const brandSel=document.getElementById('brandFilter').value;let filtered=allBikes.slice();if(qRaw||brandSel){filtered=allBikes.filter(b=>{let text=(b.name+' '+b.brand+' '+b.loc+' '+b.type+' '+(b.mileage||'')+' '+b.price).toLowerCase();if(brandSel&&b.brand!==brandSel) return false;if(!qRaw) return true;let numMatch=qRaw.match(/(\d{2,6})/);let num=numMatch?parseInt(numMatch[1]):null;let isAbove=qRaw.includes('above')||qRaw.includes('>');let isBelow=qRaw.includes('below')||qRaw.includes('under')||qRaw.includes('<');if(num!==null){if(isAbove) return b.price>=num;if(isBelow) return b.price<=num;if(qRaw.match(/^\d+$/)){let low=num*0.5;let high=num*1.8;return b.price>=low&&b.price<=high;}}let words=qRaw.split(/[\s,]+/).filter(w=>w.length>=2);return words.some(w=>text.includes(w));});}if(filtered.length===0){let numMatch=qRaw.match(/(\d{2,6})/);let fallback=numMatch?allBikes.slice().sort((a,b)=>Math.abs(a.price-parseInt(numMatch[1]))-Math.abs(b.price-parseInt(numMatch[1]))).slice(0,8):allBikes.slice(0,8);current=fallback.slice();render(fallback,qRaw||brandSel);return;}current=filtered.slice();render(filtered,qRaw||brandSel);}
function setTab(id){document.querySelectorAll('.pill').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showAll(){current=allBikes.slice();setTab('tAll');render(current);}
function showUsed(){current=usedBikes.slice();setTab('tUsed');render(current,"Used");}
function showNew(){current=newBikes.slice();setTab('tNew');render(current,"New");}
function showBudget(){current=allBikes.filter(b=>b.price<=60000);render(current,"Under 60k");}
function showAbove(){current=allBikes.filter(b=>b.price>=50000);render(current,"Above 50k");}
function filterBrand(brand){document.getElementById('brandFilter').value=brand;smartSearch();}
function addBike(){const n=document.getElementById('s_name').value.trim();const p=Number(document.getElementById('s_price').value);const ph=document.getElementById('s_phone').value.trim();if(!n||!p||!ph){alert('Fill required');return;}let mainImg=uploadedImages.length>0?uploadedImages[0]:PHOTOS[0];let newEntry={name:n,price:p,km:"20k km",year:"2023",brand:n.split(' ')[0]||"Honda",type:"Used",mileage:"55 kmpl",phone:ph,loc:"Vizag",owner:"1st Owner",img:mainImg,desc:"Excellent"};usedBikes.unshift(newEntry);allBikes=[...newBikes,...usedBikes];closeSell();showAll();}
showAll();
</script>
</body>
