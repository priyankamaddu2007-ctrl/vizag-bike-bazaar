<title>Mana Vizag Bikes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#fafafa;color:#111827}
header{background:white;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}
.nav{max-width:1100px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:800}
.btn{padding:9px 14px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #e5e7eb;background:white}
.btn.dark{background:#111827;color:white;border-color:#111827}
.pills{max-width:1100px;margin:auto;padding:14px 20px 0;display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:100px;border:1px solid #e5e7eb;background:white;font-size:12px;font-weight:500;cursor:pointer}
.pill.active{background:#111827;color:white;border-color:#111827}
.wrap{max-width:1100px;margin:auto;padding:16px 20px}
.search{display:flex;gap:8px;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:10px}
.search input{flex:1;border:none;outline:none;font-size:13px}
.search select{border:none;outline:none;background:#f9fafb;padding:6px 10px;border-radius:8px;font-size:12px}
.search button{background:#111827;color:white;border:none;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.count{font-size:12px;color:#6b7280;margin:14px 0;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:white;border:1px solid #f0f0f0;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.06)}
.card img{width:100%;height:180px;object-fit:cover;background:#fff;display:block}
.body{padding:12px}
.title{font-size:13px;font-weight:600;line-height:1.3}
.price{font-size:15px;font-weight:700;margin-top:6px}
.meta{font-size:11px;color:#6b7280;margin-top:4px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.box{background:white;width:100%;max-width:460px;border-radius:16px;overflow:hidden;max-height:90vh;overflow-y:auto}
.box img{width:100%;height:250px;object-fit:cover}
.content{padding:18px}
.btn-full{width:100%;padding:11px;border-radius:10px;border:none;font-weight:600;font-size:12px;cursor:pointer;margin-top:8px;display:block;text-align:center;text-decoration:none}
.call{background:#111827;color:white}.bord{background:white;border:1px solid #e5e7eb;color:#374151}
.footer{text-align:center;padding:28px;font-size:11px;color:#9ca3af}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">Mana Vizag Bikes</div><button class="btn dark" onclick="location.reload()">Refresh</button></div></header>
<div class="pills">
<button id="tAll" class="pill active" onclick="showAll()">All</button>
<button id="tUsed" class="pill" onclick="showUsed()">Used</button>
<button id="tNew" class="pill" onclick="showNew()">New</button>
<button id="t60" class="pill" onclick="showBudget()">Under 60k</button>
<button id="tHero" class="pill" onclick="filterBrand('Hero')">Hero</button>
<button id="tHonda" class="pill" onclick="filterBrand('Honda')">Honda</button>
</div>
<div class="wrap">
<div class="search"><input id="smartSearch" placeholder="Search bike, brand, price" onkeydown="if(event.key==='Enter')smartSearch()"><select id="brandFilter"><option value="">All</option><option>Hero</option><option>Honda</option><option>Bajaj</option><option>Yamaha</option><option>TVS</option><option>KTM</option><option>Royal Enfield</option></select><button onclick="smartSearch()">Search</button></div>
<div class="count" id="msg">Loading...</div>
<div class="grid" id="grid"></div>
</div>
<div class="modal" id="detailModal" onclick="if(event.target===this)closeDetail()"><div class="box"><div id="detailContent"></div></div></div>
<div class="footer">Mana Vizag Bikes • Exact model photos • Used/New filters working • © 2026</div>

let allBikes=[...newBikes,...usedBikes];
let currentList=allBikes.slice();

function render(list,query){
const grid=document.getElementById('grid');
grid.innerHTML='';
if(list.length===0){
grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#9ca3af">No bikes found - showing all</div>';
list=allBikes.slice(0,12);
}
list.forEach(b=>{
const globalId=allBikes.findIndex(x=>x.name===b.name && x.price===b.price);
grid.innerHTML+=`<div class="card" onclick="openDetail(${globalId})"><img src="${b.img}" loading="lazy" onerror="this.src='${P.splendor}'"><div class="body"><div class="title">${b.name}</div><div class="meta">${b.year} • ${b.mileage} • ${b.brand} • ${b.type}</div><div class="price">₹${b.price.toLocaleString('en-IN')}</div><div class="meta">${b.km} • ${b.loc}</div></div></div>`;
});
document.getElementById('msg').textContent=`${list.length} bikes ${query?`• ${query}`:''} • exact photos • click any - same bike opens`;
}

function openDetail(id){
const b=allBikes[id];
if(!b){alert('Bike not found - ID '+id);return;}
let html=`<img src="${b.img}" onerror="this.src='${P.splendor}'"><div class="content"><h3 style="font-size:14px;font-weight:700">${b.name}</h3><p style="margin-top:6px"><b style="font-size:18px">₹${b.price.toLocaleString('en-IN')}</b> <span style="font-size:11px;color:#6b7280">• ${b.km} • ${b.year} • ${b.mileage}</span></p><div style="background:#f9fafb;border:1px solid #f0f0f0;border-radius:10px;padding:10px;margin-top:10px;font-size:11px"><b>Exact Model Photo - ${b.name}</b><br>${b.type==='New'?b.showroom:b.owner}<br>${b.loc}<br>${b.mileage} • ${b.desc}</div><a class="btn-full call" href="tel:${b.phone}">Call ${b.phone}</a><a class="btn-full bord" href="https://wa.me/91${b.phone.toString().slice(-10)}" target="_blank">WhatsApp</a><button class="btn-full bord" onclick="closeDetail()">Close</button></div>`;
document.getElementById('detailContent').innerHTML=html;
document.getElementById('detailModal').classList.add('open');
}

function closeDetail(){document.getElementById('detailModal').classList.remove('open')}
function clearActive(){document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'))}
function showAll(){clearActive();document.getElementById('tAll').classList.add('active');currentList=allBikes.slice();render(currentList,'All');}
function showUsed(){clearActive();document.getElementById('tUsed').classList.add('active');currentList=usedBikes.slice();render(currentList,'Used - 15 bikes');}
function showNew(){clearActive();document.getElementById('tNew').classList.add('active');currentList=newBikes.slice();render(currentList,'New - 18 bikes');}
function showBudget(){clearActive();document.getElementById('t60').classList.add('active');currentList=allBikes.filter(b=>b.price<=60000);render(currentList,'Under 60k');}
function filterBrand(brand){clearActive();document.getElementById('brandFilter').value=brand;currentList=allBikes.filter(b=>b.brand===brand);render(currentList,brand);}
function smartSearch(){const q=document.getElementById('smartSearch').value.trim().toLowerCase();const brand=document.getElementById('brandFilter').value;clearActive();let filtered=allBikes.filter(b=>{let t=(b.name+' '+b.brand+' '+b.loc+' '+b.price).toLowerCase();if(brand&&b.brand!==brand) return false;if(!q) return true;return t.includes(q);});if(filtered.length===0){filtered=allBikes.slice(0,10);}currentList=filtered.slice();render(currentList,q||brand);}

// Initial load - WORKING
document.addEventListener('DOMContentLoaded',function(){
render(allBikes,'All 33 bikes');
});
render(allBikes,'All 33 bikes');
</script>
